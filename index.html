<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動靈感收集板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f5f7fc; padding: 2rem 1.5rem; color: #1e293b; }
        .app-container { max-width: 1000px; margin: 0 auto; }
        .hero { text-align: center; margin-bottom: 2rem; }
        .form-card { background: white; border-radius: 1.5rem; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .form-grid { display: flex; flex-wrap: wrap; gap: 1rem; }
        .input-group { flex: 1; min-width: 200px; }
        label { display: block; font-weight: bold; margin-bottom: 0.5rem; font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 0.8rem; border-radius: 0.8rem; border: 1px solid #e2e8f0; }
        .btn-submit { background: #2c7da0; color: white; border: none; padding: 0 2rem; border-radius: 2rem; cursor: pointer; height: 45px; font-weight: bold; align-self: flex-end; }
        .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .filter-group { background: white; padding: 0.3rem; border-radius: 2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .filter-btn { border: none; background: transparent; padding: 0.5rem 1rem; border-radius: 2rem; cursor: pointer; }
        .filter-btn.active { background: #2c7da0; color: white; }
        .records-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .record-card { background: white; border-radius: 1rem; padding: 1.5rem; border-left: 6px solid #2c7da0; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .record-card.done { border-left-color: #94a3b8; opacity: 0.7; }
        .status-badge { font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 1rem; background: #e2e8f0; float: right; }
        .field-title { font-size: 0.7rem; color: #64748b; text-transform: uppercase; margin-top: 0.8rem; }
        .field-content { font-weight: 500; }
        .actions { margin-top: 1rem; text-align: right; }
        .toggle-btn { font-size: 0.8rem; padding: 0.4rem 0.8rem; border-radius: 1rem; border: 1px solid #2c7da0; background: transparent; color: #2c7da0; cursor: pointer; }
        footer { text-align: center; margin-top: 3rem; color: #94a3b8; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="hero">
        <h1>✨ 活動靈感收集板</h1>
        <p>同步 Google Sheet 雲端資料庫</p>
    </div>

    <div class="form-card">
        <div class="form-grid">
            <div class="input-group">
                <label>📌 標題</label>
                <input type="text" id="title" placeholder="點子名稱">
            </div>
            <div class="input-group">
                <label>🏷️ 分類</label>
                <input type="text" id="category" placeholder="標籤">
            </div>
            <div class="input-group" style="flex: 2;">
                <label>📝 備註</label>
                <input type="text" id="note" placeholder="補充說明">
            </div>
            <button class="btn-submit" onclick="addRecord()">新增</button>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <button class="filter-btn active" onclick="filter('all', this)">全部</button>
            <button class="filter-btn" onclick="filter('active', this)">進行中</button>
            <button class="filter-btn" onclick="filter('done', this)">已完成</button>
        </div>
        <div id="stats" style="font-size: 0.9rem; color: #64748b;">載入中...</div>
    </div>

    <div id="list" class="records-container"></div>
    <footer>⚡ Data powered by Google Apps Script</footer>
</div>

<script>
    // ！！！重要：請填入你的 Web App URL ！！！
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaf2scCXLTDfus4noErCak8wYVQWtBFPi1LVhMXxSkFxbrTyfiAUVBR3wGJOh03Vz6bQ/exec";

    let records = [];
    let currentFilter = 'all';

    async function fetchData() {
        try {
            const res = await fetch(APPS_SCRIPT_URL);
            const data = await res.json();
            if (data.ok) {
                records = data.records;
                render();
            }
        } catch (e) {
            document.getElementById('list').innerHTML = "連線失敗，請檢查 API 網址或權限設定。";
        }
    }

    async function addRecord() {
        const title = document.getElementById('title').value;
        const category = document.getElementById('category').value;
        const note = document.getElementById('note').value;

        if (!title || !category) return alert("請填寫必填欄位");

        const newRecord = {
            id: Date.now().toString(),
            createdAt: new Date().toISOString(),
            status: 'active',
            title,
            category,
            note
        };

        // 預先顯示在畫面上 (Optimistic UI)
        records.unshift(newRecord);
        render();

        // 同步至後端
        await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "create", record: newRecord })
        });
        
        document.getElementById('title').value = '';
        document.getElementById('category').value = '';
        document.getElementById('note').value = '';
    }

    async function toggleStatus(id) {
        const r = records.find(x => x.id === id);
        if (!r) return;
        r.status = r.status === 'active' ? 'done' : 'active';
        render();

        await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ 
                action: "update", 
                record: { id: r.id, status: r.status } 
            })
        });
    }

    function filter(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function render() {
        const container = document.getElementById('list');
        const filtered = records.filter(r => currentFilter === 'all' || r.status === currentFilter);
        
        container.innerHTML = filtered.map(r => `
            <div class="record-card ${r.status === 'done' ? 'done' : ''}">
                <span class="status-badge">${r.status === 'active' ? '✨ 進行中' : '✅ 已完成'}</span>
                <div class="field-title">標題</div>
                <div class="field-content">${r.title}</div>
                <div class="field-title">分類</div>
                <div class="field-content">${r.category}</div>
                ${r.note ? `<div class="field-title">備註</div><div class="field-content">${r.note}</div>` : ''}
                <div class="actions">
                    <button class="toggle-btn" onclick="toggleStatus('${r.id}')">
                        ${r.status === 'active' ? '標記完成' : '重啟項目'}
                    </button>
                </div>
            </div>
        `).join('');

        document.getElementById('stats').innerText = `總計: ${records.length} 筆`;
    }

    window.onload = fetchData;
</script>
</body>
</html>
