<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動靈感收集板 | 創意點子庫</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f5f7fc; padding: 2rem 1.5rem; color: #1e293b; line-height: 1.5; }
        .app-container { max-width: 1000px; margin: 0 auto; }
        .hero { text-align: center; margin-bottom: 2rem; }
        .hero h1 { font-size: 2rem; color: #1e2b3c; margin-bottom: 0.5rem; }
        .form-card { background: white; border-radius: 1.5rem; padding: 1.8rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 2.5rem; }
        .form-grid { display: flex; flex-wrap: wrap; gap: 1.2rem; }
        .input-group { flex: 1; min-width: 200px; }
        label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.5rem; color: #475569; }
        input, textarea { width: 100%; padding: 0.75rem 1rem; border-radius: 1rem; border: 1.5px solid #e2e8f0; font-size: 1rem; }
        input:focus { outline: none; border-color: #2c7da0; }
        .btn-submit { background: #2c7da0; color: white; border: none; padding: 0 2rem; border-radius: 2rem; font-weight: 700; cursor: pointer; height: 50px; align-self: flex-end; transition: 0.3s; }
        .btn-submit:hover { background: #1f5e7a; transform: translateY(-2px); }
        .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .filter-group { background: #fff; padding: 0.3rem; border-radius: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .filter-btn { border: none; background: transparent; padding: 0.6rem 1.2rem; border-radius: 2rem; cursor: pointer; font-weight: 600; color: #64748b; }
        .filter-btn.active { background: #2c7da0; color: white; }
        .stats { font-size: 0.85rem; color: #64748b; background: #eef2f6; padding: 0.4rem 1rem; border-radius: 1rem; }
        .records-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .record-card { background: white; border-radius: 1.5rem; padding: 1.5rem; border-left: 8px solid #2c7da0; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .record-card.done-card { border-left-color: #94a3b8; opacity: 0.7; background: #fcfcfc; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .status-badge { font-size: 0.7rem; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: 1rem; background: #e2e8f0; }
        .field-title { font-size: 0.7rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-top: 0.8rem; }
        .field-content { font-size: 1rem; font-weight: 600; color: #1e293b; margin-bottom: 0.2rem; }
        .card-actions { margin-top: 1.2rem; display: flex; justify-content: flex-end; }
        .toggle-btn { background: #f1f5f9; border: none; padding: 0.5rem 1rem; border-radius: 1rem; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
        .toggle-btn:hover { background: #e2e8f0; }
        .loading-msg { text-align: center; padding: 3rem; color: #64748b; grid-column: 1/-1; }
        footer { text-align: center; margin-top: 4rem; color: #94a3b8; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="hero">
        <h1>✨ 活動靈感收集板</h1>
        <p>隨手記下你的創意點子｜雲端同步完成</p>
    </div>

    <div class="form-card">
        <div class="form-grid">
            <div class="input-group">
                <label>📌 靈感標題</label>
                <input type="text" id="title" placeholder="例：校園音樂祭">
            </div>
            <div class="input-group">
                <label>🏷️ 分類</label>
                <input type="text" id="category" placeholder="例：藝術、公益">
            </div>
            <div class="input-group" style="flex: 2;">
                <label>📝 補充說明</label>
                <input type="text" id="note" placeholder="想法說明...">
            </div>
            <button class="btn-submit" onclick="addRecord()">＋ 新增點子</button>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <button class="filter-btn active" onclick="setFilter('all', this)">全部</button>
            <button class="filter-btn" onclick="setFilter('active', this)">進行中</button>
            <button class="filter-btn" onclick="setFilter('done', this)">已完成</button>
        </div>
        <div class="stats" id="stats">載入中...</div>
    </div>

    <div id="list" class="records-container">
        <div class="loading-msg">正在連線至雲端資料庫...</div>
    </div>
    
    <footer>⚡ Data synced with Google Sheets</footer>
</div>

<script>
    // 1. 填入你正式部署的 /exec 網址
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaf2scCXLTDfus4noErCak8wYVQWtBFPi1LVhMXxSkFxbrTyfiAUVBR3wGJOh03Vz6bQ/exec";

    let records = [];
    let currentFilter = 'all';

    // 2. 核心：讀取資料 (處理 Redirect)
    async function fetchData() {
        try {
            const res = await fetch(APPS_SCRIPT_URL);
            const data = await res.json();
            if (data.ok) {
                records = data.records;
                render();
            }
        } catch (e) {
            console.error("Fetch error:", e);
            document.getElementById('list').innerHTML = `<div class="loading-msg">⚠️ 無法存取資料庫。請確認無痕模式是否允許 Cookie。</div>`;
        }
    }

    // 3. 核心：新增資料 (不使用 no-cors)
    async function addRecord() {
        const t = document.getElementById('title');
        const c = document.getElementById('category');
        const n = document.getElementById('note');

        if (!t.value || !c.value) return alert("標題與分類是必填的喔！");

        const newRecord = {
            id: Date.now().toString(),
            createdAt: new Date().toISOString(),
            status: 'active',
            title: t.value,
            category: c.value,
            note: n.value
        };

        // 先在介面顯示 (Optimistic UI)
        records.unshift(newRecord);
        render();

        // 傳送到後端
        try {
            await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "create", record: newRecord })
            });
        } catch (e) {
            console.error("Sync error:", e);
        }

        t.value = ''; c.value = ''; n.value = '';
    }

    // 4. 更新狀態
    async function toggleStatus(id) {
        const r = records.find(x => x.id === id);
        if (!r) return;
        r.status = r.status === 'active' ? 'done' : 'active';
        render();

        try {
            await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "update", record: { id: r.id, status: r.status } })
            });
        } catch (e) { console.error(e); }
    }

    function setFilter(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function render() {
        const list = document.getElementById('list');
        const filtered = records.filter(r => currentFilter === 'all' || r.status === currentFilter);
        
        if (filtered.length === 0) {
            list.innerHTML = `<div class="loading-msg">💡 目前沒有點子，新增一個吧！</div>`;
        } else {
            list.innerHTML = filtered.map(r => `
                <div class="record-card ${r.status === 'done' ? 'done-card' : ''}">
                    <div class="card-header">
                        <span class="status-badge">${r.status === 'active' ? '✨ 進行中' : '✅ 已完成'}</span>
                    </div>
                    <div class="field-title">標題</div>
                    <div class="field-content">${r.title}</div>
                    <div class="field-title">分類</div>
                    <div class="field-content">${r.category}</div>
                    ${r.note ? `<div class="field-title">備註</div><div class="field-content" style="font-size:0.85rem; color:#64748b">${r.note}</div>` : ''}
                    <div class="card-actions">
                        <button class="toggle-btn" onclick="toggleStatus('${r.id}')">
                            ${r.status === 'active' ? '完成它' : '重啟'}
                        </button>
                    </div>
                </div>
            `).join('');
        }
        document.getElementById('stats').innerText = `總計 ${records.length} 個點子`;
    }

    // 初始化讀取
    window.onload = fetchData;
</script>
</body>
</html>
