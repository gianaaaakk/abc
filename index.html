<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>活動靈感收集板 | 創意點子庫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f5f7fc 0%, #eef2f6 100%);
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        /* 主容器 */
        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* 標題區 */
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2.3rem;
            background: linear-gradient(135deg, #1e2b3c, #2c4c6e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .hero p {
            color: #4a627a;
            margin-top: 0.5rem;
            font-weight: 500;
        }

        /* 卡片風格表單 */
        .form-card {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            padding: 1.8rem 2rem;
            margin-bottom: 2.5rem;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            flex: 1;
            min-width: 180px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            color: #1f3b4c;
            letter-spacing: 0.3px;
        }

        .input-group label span {
            color: #d9534f;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 1.2rem;
            border: 1.5px solid #e2e8f0;
            background: #fefefe;
            transition: 0.2s;
            font-size: 0.95rem;
            resize: vertical;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #2c7da0;
            box-shadow: 0 0 0 3px rgba(44,125,160,0.15);
        }

        .btn-submit {
            background: #2c7da0;
            color: white;
            border: none;
            padding: 0 2rem;
            border-radius: 2.5rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            height: 52px;
            align-self: flex-end;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .btn-submit:hover {
            background: #1f5e7a;
            transform: translateY(-2px);
        }

        /* 篩選列 + 計數 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
            gap: 1rem;
        }

        .filter-group {
            background: white;
            padding: 0.3rem;
            border-radius: 3rem;
            display: inline-flex;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            gap: 0.2rem;
        }

        .filter-btn {
            border: none;
            background: transparent;
            padding: 0.6rem 1.4rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: #2d3e50;
        }

        .filter-btn.active {
            background: #2c7da0;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .stats {
            background: #e9edf2;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #2c3e50;
        }

        /* 顯示方式 — 卡片風格 (卡片 / 卡片流) */
        .records-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* 卡片樣式 */
        .record-card {
            background: white;
            border-radius: 1.5rem;
            padding: 1.3rem 1.5rem;
            transition: 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border-left: 8px solid #2c7da0;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .record-card.done-card {
            border-left-color: #94a3b8;
            background: #f9fafc;
            opacity: 0.85;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.8rem;
            border-radius: 2rem;
            background: #e2e8f0;
            color: #334155;
        }

        .status-badge.done-status {
            background: #d1dbe8;
            color: #1e2a3a;
        }

        .status-badge.active-status {
            background: #cfe8f0;
            color: #0f4c5f;
        }

        .field-title {
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            color: #5b6e8c;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .field-content {
            font-size: 1rem;
            font-weight: 500;
            color: #1e293b;
            word-break: break-word;
        }

        .optional-field {
            background: #f1f5f9;
            padding: 0.3rem 0.7rem;
            border-radius: 1rem;
            font-size: 0.85rem;
        }

        .created-time {
            font-size: 0.7rem;
            color: #6c86a3;
            margin-top: 0.3rem;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.5rem;
            gap: 0.8rem;
        }

        .toggle-btn {
            background: #eef2ff;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.1s;
            color: #2d3e50;
        }

        .toggle-btn:hover {
            background: #d9e2ef;
        }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 2rem;
            color: #6c86a3;
            font-weight: 500;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.75rem;
            color: #6c86a3;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .form-card {
                padding: 1.2rem;
            }
            .btn-submit {
                width: 100%;
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="hero">
        <h1>✨ 活動靈感收集板 ✨</h1>
        <p>隨手記下你的創意點子｜狀態追蹤｜本地保存</p>
    </div>

    <div class="form-card">
        <div class="form-grid">
            <div class="input-group">
                <label>📌 靈感標題 <span>(必填)</span></label>
                <input type="text" id="ideaTitle" placeholder="例：校園音樂祭、二手書市集..." autocomplete="off">
            </div>
            <div class="input-group">
                <label>🏷️ 分類 / 標籤 <span>(必填)</span></label>
                <input type="text" id="ideaCategory" placeholder="例：音樂、藝文、公益、戶外" autocomplete="off">
            </div>
            <div class="input-group">
                <label>📝 補充說明 <span>(可選)</span></label>
                <textarea id="ideaNote" rows="1" placeholder="簡單筆記、資源需求或任何想法..."></textarea>
            </div>
            <button class="btn-submit" id="addBtn">＋ 新增點子</button>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">📋 全部</button>
            <button class="filter-btn" data-filter="active">✨ 進行中</button>
            <button class="filter-btn" data-filter="done">✅ 已完成</button>
        </div>
        <div class="stats" id="statsInfo">載入中...</div>
    </div>

    <div id="recordsList" class="records-container">
        <!-- 動態渲染區 -->
        <div class="empty-message">💡 還沒有任何點子，新增一個活動靈感吧！</div>
    </div>
    <footer>⚡ 資料自動儲存於瀏覽器 · 可切換狀態完成進度</footer>
</div>

<script>
    // ======================= Data Contract (資料契約) =======================
    // 每筆 record 結構:
    // {
    //   id: string,            // 唯一識別: Date.now() + "_" + random string
    //   createdAt: string,     // ISO 格式 new Date().toISOString()
    //   status: string,        // 'active' 或 'done'
    //   title: string,         // 自訂欄位1: 靈感標題 (必填)
    //   category: string,      // 自訂欄位2: 分類/標籤 (必填)
    //   note: string           // 自訂欄位3: 補充說明 (可選，可為空字串)
    // }
    //
    // 功能對應主題:
    // - 系統名稱: 活動靈感收集板 (班級/個人點子庫)
    // - 一筆資料: 點子記錄
    // - 顯示方式: 卡片 (grid 卡片)
    // - done 狀態文字: 已完成, active 文字: 進行中
    // ========================================================================

    // 全域 records 陣列
    let records = [];

    // DOM 元素
    const titleInput = document.getElementById('ideaTitle');
    const categoryInput = document.getElementById('ideaCategory');
    const noteInput = document.getElementById('ideaNote');
    const addBtn = document.getElementById('addBtn');
    const recordsContainer = document.getElementById('recordsList');
    const statsSpan = document.getElementById('statsInfo');

    let currentFilter = 'all';   // 'all', 'active', 'done'

    // ----- 輔助 function: 產生簡短 random id (搭配時間戳) -----
    function generateId() {
        return Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    }

    // 1. createRecord: 根據表單內容建立完整 record object
    function createRecord(formData) {
        // formData 預期包含 title, category, note (note 可為空)
        const nowISO = new Date().toISOString();
        return {
            id: generateId(),
            createdAt: nowISO,
            status: 'active',           // 預設 active
            title: formData.title.trim(),
            category: formData.category.trim(),
            note: formData.note ? formData.note.trim() : ''
        };
    }
